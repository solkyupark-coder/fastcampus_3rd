<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MCP 서버, 플러그인, 127.0.0.1, 오픈소스, DAE, SketchUp MCP, Scene, 컴포넌트, 나노바나나, rhwp, FreeCAD MCP, 배포, 검증 용어 카드">
  <title>3주차 키워드</title>
  <style>
    :root {
      --paper: #e9e4da;
      --card: #fffdf8;
      --ink: #27354a;
      --muted: #657083;
      --line: #c8c0b2;
      --accent: #b64f36;
      --soft: #f2eee6;
      --shadow: 0 18px 46px rgba(39, 53, 74, .16);
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 84% 10%, rgba(255,255,255,.75), transparent 28rem),
        var(--paper);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid #2d68a7; outline-offset: 3px; }
    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 14px;
      width: min(100%, 1500px);
      height: 100dvh;
      margin: 0 auto;
      padding: 20px 24px 18px;
    }
    .masthead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
    }
    .eyebrow {
      margin: 0;
      color: var(--accent);
      font: 700 13px/1.2 Consolas, "Courier New", monospace;
      letter-spacing: .12em;
    }
    h1 {
      margin: 3px 0 0;
      font-size: clamp(22px, 2.2vw, 34px);
      line-height: 1.15;
      letter-spacing: -.04em;
    }
    .intro {
      max-width: 560px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      text-align: right;
    }
    .workspace {
      display: grid;
      grid-template-columns: 228px minmax(0, 1fr);
      gap: clamp(20px, 3vw, 46px);
      min-height: 0;
    }
    .terms {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
      overflow: auto;
      padding-top: 2px;
    }
    .group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .group-label {
      margin: 0 0 4px;
      color: var(--muted);
      font: 700 11px/1 Consolas, "Courier New", monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .term {
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 40px;
      padding: 7px 10px;
      border: 0;
      border-left: 3px solid transparent;
      color: var(--muted);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, transform .18s ease;
    }
    .term:hover { color: var(--ink); background: rgba(255,255,255,.42); }
    .term:active { transform: translateX(2px); }
    .term[aria-current="true"] {
      border-left-color: var(--accent);
      color: var(--ink);
      background: var(--card);
      box-shadow: 0 4px 14px rgba(39, 53, 74, .08);
    }
    .term-number {
      color: var(--accent);
      font: 700 12px/1 Consolas, "Courier New", monospace;
    }
    .term-name {
      overflow: hidden;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stage {
      display: grid;
      min-width: 0;
      min-height: 0;
      perspective: 1800px;
    }
    .card {
      position: relative;
      align-self: stretch;
      justify-self: center;
      width: min(100%, 960px);
      min-height: 0;
      cursor: pointer;
    }
    .card.is-snap .face {
      transition: none;
    }
    .face {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      padding: clamp(16px, 2.2vw, 28px);
      overflow: hidden;
      border: 1px solid rgba(39, 53, 74, .16);
      border-radius: 3px;
      background: var(--card);
      box-shadow: var(--shadow);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform-origin: center center;
      transition: transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .front {
      transform: rotateY(0deg);
      z-index: 1;
    }
    .back {
      transform: rotateY(180deg);
      z-index: 0;
    }
    .card.is-flipped .front {
      transform: rotateY(-180deg);
      z-index: 0;
    }
    .card.is-flipped .back {
      transform: rotateY(0deg) scale(1.02);
      z-index: 1;
    }
    .face-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 0;
    }
    .face h2 {
      margin: 0;
      font: 700 clamp(30px, 4vw, 54px)/1 Consolas, "Courier New", monospace;
      letter-spacing: -.05em;
    }
    .side-label {
      color: var(--accent);
      font: 700 12px/1 Consolas, "Courier New", monospace;
      letter-spacing: .12em;
    }
    .front {
      grid-template-rows: auto minmax(220px, 1fr) auto;
      gap: 0.5rem;
    }
    .front-body { display: contents; }
    .visual {
      display: grid;
      align-self: stretch;
      min-height: 220px;
      height: 100%;
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--soft);
    }
    .visual img, .visual svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      object-position: center;
    }
    .copy, .back-copy {
      display: grid;
      gap: 0.9em;
      word-break: keep-all;
    }
    .copy {
      align-self: start;
      max-width: 760px;
      font-size: clamp(15px, 1.25vw, 18px);
      line-height: 1.55;
    }
    .back-body {
      display: grid;
      align-content: center;
      gap: 1em;
      min-height: 0;
      padding: 0;
    }
    .back-copy {
      max-width: 790px;
      font-size: clamp(16px, 1.4vw, 20px);
      line-height: 1.55;
    }
    .block { margin: 0; }
    .block h3 {
      margin: 0 0 0.18em;
      color: var(--accent);
      font-size: 0.78em;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .block p { margin: 0; line-height: 1.55; }
    .source {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .controls {
      display: grid;
      grid-template-columns: auto auto minmax(180px, 360px) auto;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .control {
      min-height: 48px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      color: var(--ink);
      background: var(--card);
      cursor: pointer;
      transition: transform .16s ease, background .16s ease;
    }
    .control:hover { background: #f7f2e9; }
    .control:active { transform: translateY(1px); }
    .flip {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
      font-weight: 700;
    }
    .flip:hover { background: #98402d; }
    .counter {
      min-width: 62px;
      margin: 0;
      text-align: center;
      font: 700 14px/1 Consolas, "Courier New", monospace;
    }
    @media (max-width: 760px) {
      body { overflow: hidden; }
      .app {
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        gap: 10px;
        padding: 12px 12px 10px;
      }
      .masthead { display: block; }
      .eyebrow { font-size: 11px; }
      h1 { margin-top: 2px; font-size: 21px; }
      .intro { display: none; }
      .workspace { display: contents; }
      .terms {
        grid-row: 2;
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
        overflow: visible;
        padding: 0 1px 4px;
      }
      .group {
        flex-direction: row;
        align-items: center;
        flex: 0 0 auto;
        gap: 6px;
        overflow-x: auto;
        padding-right: 0;
        border-right: 0;
        scrollbar-width: thin;
        scroll-snap-type: x proximity;
      }
      .group-label { margin: 0; flex: 0 0 auto; }
      .term {
        display: block;
        flex: 0 0 auto;
        width: auto;
        min-height: 42px;
        padding: 8px 13px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: rgba(255,255,255,.45);
        scroll-snap-align: start;
        text-align: center;
      }
      .term[aria-current="true"] { border-color: var(--accent); background: var(--card); }
      .term-number { display: none; }
      .stage { grid-row: 3; }
      .face { padding: 16px; border-radius: 2px; }
      .face-head { margin-bottom: 0; }
      .face h2 { font-size: clamp(27px, 8vw, 36px); }
      .front {
        grid-template-rows: auto auto auto;
        align-content: start;
        gap: 0.4rem;
      }
      .visual {
        min-height: 220px;
        height: auto;
        width: calc(100% + 32px);
        margin-left: -16px;
        border-left: 0;
        border-right: 0;
        aspect-ratio: 960 / 520;
      }
      .visual img, .visual svg { min-height: 0; height: 100%; }
      .copy { font-size: clamp(13px, 3.5vw, 15px); line-height: 1.48; }
      .copy, .back-copy { gap: 0.8em; }
      .back-body { gap: 0.8em; padding: 0.4vh 0 0; }
      .back-copy { font-size: clamp(14px, 3.8vw, 16px); line-height: 1.5; }
      .controls {
        grid-row: 4;
        grid-template-columns: auto auto 1fr auto;
        gap: 6px;
      }
      .control { min-height: 44px; padding: 0 12px; }
      .counter { min-width: 48px; font-size: 12px; }
    }
    @media (min-width: 761px) {
      .visual { min-height: 360px; }
    }
    @media (max-width: 370px) {
      .app { padding-top: 8px; gap: 7px; }
      .copy { font-size: 13px; line-height: 1.42; }
      .back-copy { font-size: 13px; line-height: 1.45; }
      .source { font-size: 10px; }
      .control { padding: 0 9px; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
      .card,
      .card.is-flipped,
      .front,
      .back {
        transform: none !important;
      }
      .back {
        visibility: hidden;
        pointer-events: none;
      }
      .card.is-flipped .front {
        visibility: hidden;
        pointer-events: none;
      }
      .card.is-flipped .back {
        visibility: visible;
        pointer-events: auto;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="masthead">
      <div>
        <p class="eyebrow">FASTCAMPUS · LAND DEVELOPMENT</p>
        <h1>3주차 키워드</h1>
      </div>
      <p class="intro">AI가 열려 있는 설계 프로그램을 대신 만지는 구조 — MCP, 플러그인, 오픈소스 도구, 그리고 결과물로 확인하는 법.</p>
    </header>

    <div class="workspace">
      <nav class="terms" aria-label="용어 목록"></nav>
      <section class="stage" aria-live="polite" aria-label="용어 카드">
        <article class="card" tabindex="0" aria-label="카드를 눌러 앞뒤 보기">
          <div class="face front"></div>
          <div class="face back"></div>
        </article>
      </section>
    </div>

    <footer class="controls">
      <button class="control" id="prev" type="button" aria-label="이전 용어">이전</button>
      <p class="counter" aria-live="polite"><span id="current">01</span> / 16</p>
      <button class="control flip" id="flip" type="button" aria-pressed="false">설명 뒤집기</button>
      <button class="control" id="next" type="button" aria-label="다음 용어">다음</button>
    </footer>
  </main>

  <script>

        source: "참고: 3주차 슬라이드 「오늘 확인하는 방법」 · 마무리 세 줄"
      }

    const terms = document.querySelector(".terms");
    const card = document.querySelector(".card");
    const front = document.querySelector(".front");
    const back = document.querySelector(".back");
    const flipButton = document.getElementById("flip");
    const current = document.getElementById("current");
    let index = 0;
    let flipped = false;

    const blocks = (items) => items.map((item) => `<section class="block"><h3>${item.h}</h3><p>${item.p}</p></section>`).join("");
    const groupMeta = { core: "MCP 구조", tool: "도구", ship: "마무리" };

    terms.innerHTML = Object.keys(groupMeta).map((id) => `
      <div class="group" data-group="${id}">
        <p class="group-label">${groupMeta[id]}</p>
        ${cards.map((item, i) => item.group !== id ? "" : `
          <button class="term" type="button" data-index="${i}">
            <span class="term-number">${String(i + 1).padStart(2, "0")}</span>
            <span class="term-name">${item.term}</span>
          </button>`).join("")}
      </div>`).join("");

    function render() {
      const item = cards[index];
      card.classList.add("is-snap");
      front.innerHTML = `
        <div class="face-head"><h2>${item.term}</h2><span class="side-label">DEFINITION</span></div>
        <div class="front-body">
          <figure class="visual" role="img" aria-label="${item.alt}">${item.image}</figure>
          <div class="copy">${blocks(item.front)}</div>
        </div>`;
      back.innerHTML = `
        <div class="face-head"><h2>${item.term}</h2><span class="side-label">MORE DETAIL</span></div>
        <div class="back-body">
          <div class="back-copy">${blocks(item.back)}</div>
          <p class="source">${item.source}</p>
        </div>`;
      flipped = false;
      card.classList.remove("is-flipped");
      flipButton.setAttribute("aria-pressed", "false");
      flipButton.textContent = "설명 뒤집기";
      current.textContent = String(index + 1).padStart(2, "0");
      document.querySelectorAll(".term").forEach((button) => {
        const active = Number(button.dataset.index) === index;
        button.toggleAttribute("aria-current", active);
        if (active) button.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
      });
      requestAnimationFrame(() => {
        requestAnimationFrame(() => card.classList.remove("is-snap"));
      });
    }

    function go(nextIndex) {
      index = (nextIndex + cards.length) % cards.length;
      render();
    }

    function flip() {
      flipped = !flipped;
      card.classList.toggle("is-flipped", flipped);
      flipButton.setAttribute("aria-pressed", String(flipped));
      flipButton.textContent = flipped ? "정의로 돌아가기" : "설명 뒤집기";
    }

    terms.addEventListener("click", (event) => {
      const button = event.target.closest("[data-index]");
      if (button) go(Number(button.dataset.index));
    });
    document.getElementById("prev").addEventListener("click", () => go(index - 1));
    document.getElementById("next").addEventListener("click", () => go(index + 1));
    flipButton.addEventListener("click", flip);
    card.addEventListener("click", flip);
    card.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        flip();
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") go(index - 1);
      if (event.key === "ArrowRight") go(index + 1);
    });

    render();
  </script>
